# Mask2Former configuration (FUTURE USE - requires additional setup)
wandb:
  online: 1
  project: "fuselage_segmentation_hpo"

dataset:
  data_path: "./data/cropped_data/"
  random_seed: 123
  shuffle: 1
  fold: 1
  batch_size: 2  # Smaller batch for Mask2Former (more memory intensive)
  crop_size: 512
  augmentation: 1
  val_aug: 0
  normalize_imagenet: 1

model:
  name: "mask2former"
  architecture: "mask2former"
  backbone: "swin_tiny"  # Options: swin_tiny, swin_small, swin_base, resnet50, resnet101
  num_classes: 4  # Background + Mark + Graffio + Drill
  num_queries: 30  # Mask2Former specific
  exp_name: 'mask2former_hpo'
  checkpoint: null
  pretrained: true
  frozen_stages: -1

opt:
  lr: 0.0001
  weight_decay: 0.0001
  es_patience: 8
  lr_patience: 6
  epochs: 100
  num_workers: 12
  weights: [1, 1, 1.05, 2.5]  # 4 classes: Background, Mark, Graffio, Drill
  save_each_epoch: 0
  method: 'bayes'
  metric_name: 'Validation IoU'
  metric_goal: 'maximize'

  # Mask2Former specific loss weights
  mask_weight: 5.0
  dice_weight: 5.0
  cls_weight: 2.0
  deep_supervision: true
  dec_layers: 9