# DeepLabV3+ configuration
wandb:
  online: 1
  project: "fuselage_segmentation_deeplab_hpo"

dataset:
  data_path: "./data/cropped_data/"
  random_seed: 123
  shuffle: 1
  fold: 1
  batch_size: 4
  crop_size: 512
  augmentation: 1
  val_aug: 0
  normalize_imagenet: 1

model:
  name: "deeplabv3plus"
  architecture: "deeplabv3plus"
  backbone: "resnet50"  # Options: resnet50, resnet101
  num_classes: 4  # Background + Mark + Graffio + Drill
  exp_name: 'deeplabv3plus_hpo'
  checkpoint: null
  pretrained: true
  frozen_stages: -1

opt:
  lr: 0.0001
  weight_decay: 0.0001
  es_patience: 8
  lr_patience: 6
  epochs: 100
  num_workers: 12
  weights: [1, 1, 1.05, 2.5]  # 4 classes: Background, Mark, Graffio, Drill
  save_each_epoch: 0
  method: 'bayes'
  metric_name: 'Validation IoU'
  metric_goal: 'maximize'