# Quick screening: test all architectures with default params
# Goal: Find which architecture works best
method: grid
metric:
  name: Validation IoU
  goal: maximize

parameters:
  fold:
    value: 1

  epochs:
    value: 50  # Short for screening

  batch:
    value: 4

  crop_size:
    value: 512

  architecture:
    values: ["deeplabv3plus", "pspnet"]  # Test MMSeg models first
    # Add "segformer" to compare with existing baseline
    # Add "mask2former" when ready (requires additional setup)

  backbone:
    values: ["resnet50"]  # Same backbone for fair comparison

  classes_weights:
    value: [1, 1, 1.05, 2.5]

  lr:
    value: 0.0001

  weight_decay:
    value: 0.0001

  lr_patience:
    value: 5

  es_patience:
    value: 7

  n_gpus:
    value: 1

  ncpus:
    value: 6

program:
  train_segmentator.py